<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Format, minify and validate JSON in your browser, with a tree view and exact error locations. Nothing is uploaded.">
  <title>Brace JSON Formatter</title>
  <script>
    // Apply a saved Light or Dark choice before the page draws, so it never flashes
    // the wrong colours. Uses the same storage key as js/theme.js.
    try {
      const savedTheme = localStorage.getItem('brace:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {
      // Storage is blocked: the page follows the system setting.
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a85d00'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <!-- Every own file carries ?v=<release>. Browsers cache files for 10 minutes, so a new
       release needs new URLs or visitors get the new page with old styles or scripts.
       Bump all of them together when you release: see "Releasing" in the README. -->
  <link rel="stylesheet" href="styles.css?v=2026-11-09.2">
  <script type="importmap">
    {
      "imports": {
        "./js/json-engine.js": "./js/json-engine.js?v=2026-11-09.2",
        "./js/syntax-checker.js": "./js/syntax-checker.js?v=2026-11-09.2",
        "./js/result-panel.js": "./js/result-panel.js?v=2026-11-09.2",
        "./js/highlighter.js": "./js/highlighter.js?v=2026-11-09.2",
        "./js/tree-view.js": "./js/tree-view.js?v=2026-11-09.2",
        "./js/notifications.js": "./js/notifications.js?v=2026-11-09.2",
        "./js/storage.js": "./js/storage.js?v=2026-11-09.2",
        "./js/html.js": "./js/html.js?v=2026-11-09.2",
        "./js/theme.js": "./js/theme.js?v=2026-11-09.2"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1><b>{</b>brace<b>}</b></h1>
        <p>Format, validate and explore JSON. Runs entirely in your browser.</p>
      </div>

      <div class="toolbar" role="toolbar" aria-label="Formatting options">
        <label class="select-label" for="indent-select">
          Indent
          <span class="select-control">
            <select id="indent-select">
              <option value="2">2 spaces</option>
              <option value="4">4 spaces</option>
              <option value="tab">Tabs</option>
            </select>
          </span>
        </label>
        <label class="checkbox-label" for="sort-keys-checkbox">
          <input type="checkbox" id="sort-keys-checkbox">
          Sort keys
        </label>
        <span class="separator" aria-hidden="true"></span>
        <div class="button-group">
          <button type="button" class="primary" id="format-button">Format</button>
          <button type="button" id="minify-button">Minify</button>
        </div>
        <span class="separator" aria-hidden="true"></span>
        <div class="segmented-control" role="group" aria-label="Colour theme">
          <button type="button" data-theme-choice="auto" aria-pressed="true" title="Follow your system setting">Auto</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
    </header>

    <main class="panes">
      <section class="pane" id="input-pane" aria-label="Input">
        <div class="pane-header">
          <div class="pane-title">
            Input
            <span class="badge" id="sample-badge" hidden>Example data</span>
          </div>
          <div class="pane-actions">
            <label class="file-button ghost">
              Open file
              <input type="file" id="file-input" accept=".json,application/json,text/plain" aria-label="Open a JSON file">
            </label>
            <button type="button" class="ghost" id="sample-button">Sample</button>
            <button type="button" class="ghost" id="repair-button"
              title="Fix trailing commas, single quotes, comments, missing quotes and more">Repair</button>
            <button type="button" class="ghost" id="clear-button">Clear</button>
          </div>
        </div>
        <textarea id="json-input" spellcheck="false" autocomplete="off" autocapitalize="off"
          aria-label="JSON input" placeholder="Paste JSON here, or drop a .json file"></textarea>
      </section>

      <section class="pane" aria-label="Result">
        <div class="pane-header">
          <div class="segmented-control" role="tablist" aria-label="Result view">
            <button type="button" role="tab" id="text-tab" aria-selected="true" aria-controls="text-view">Text</button>
            <button type="button" role="tab" id="tree-tab" aria-selected="false" aria-controls="tree-view">Tree</button>
          </div>
          <div class="pane-actions">
            <span id="tree-actions" hidden>
              <button type="button" class="ghost" id="expand-button">Expand all</button>
              <button type="button" class="ghost" id="collapse-button">Collapse</button>
            </span>
            <button type="button" id="copy-button">Copy</button>
          </div>
        </div>

        <div class="result-view" id="text-view" role="tabpanel" aria-labelledby="text-tab">
          <pre class="code" id="formatted-code"></pre>
        </div>
        <div class="result-view" id="tree-view" role="tabpanel" aria-labelledby="tree-tab" hidden>
          <div class="tree" id="tree-root"></div>
        </div>

        <div class="path-bar" id="path-bar" hidden>
          <span>Path</span>
          <code id="selected-path">$</code>
          <button type="button" class="ghost" id="copy-path-button">Copy path</button>
        </div>
      </section>
    </main>

    <div class="status-bar" aria-live="polite">
      <span class="status-chip" id="status-chip">Waiting for input</span>
      <span class="stats" id="stats"></span>
      <span class="shortcut-hint"><kbd id="modifier-key">Ctrl</kbd><kbd>Enter</kbd> format</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- Libraries, pinned to exact versions with integrity hashes.
       lossless-json keeps numbers exact; jsonrepair powers the Repair button. -->
  <script src="https://cdn.jsdelivr.net/npm/lossless-json@4.3.3/lib/umd/lossless-json.js"
    integrity="sha384-WePis4DZsGmbLSh7jVUfBh/a94MXtwlbHPEXxp1bW6ta6shOIfrFw2vG2bTRVlGc" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsonrepair@3.15.0/lib/umd/jsonrepair.min.js"
    integrity="sha384-ctyn1nJHmrUzPGMF/9OFj4kWb28qMVVUo8mxOFFsucMChxe5/pHDOpj/EKKPzQOG" crossorigin="anonymous"></script>

  <!-- App code. Modules run after the page and the libraries above have loaded. -->
  <script type="module" src="js/main.js?v=2026-11-09.2"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Format, minify and validate JSON in your browser, with a tree view and exact error locations. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a85d00'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<title>Brace JSON Formatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: toolbar band on top, two working panes (source | result) side by side, status line below; stacks to one column on phones */
:root {
  --bg: #f1f3f6; --surface: #ffffff; --sunk: #f7f8fa; --ink: #191d26; --muted: #576073; --faint: #9aa2b1; --line: #d9dde5;
  --accent: #a85d00; --accent-ink: #ffffff; --accent-soft: #fbefdc;
  --good: #1b7444; --good-soft: #e1f2e8; --bad: #b8322a; --bad-soft: #fbe5e3;
  --t-key: #1f4fa8; --t-str: #1b7444; --t-num: #7a3fb0; --t-bool: #b0521a; --t-null: #858b97; --t-punc: #6b7384;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #161a21; --sunk: #12161c; --ink: #e4e8ef; --muted: #98a1b3; --faint: #5f6879; --line: #2a303b;
    --accent: #f2b24a; --accent-ink: #1d1405; --accent-soft: #3a2a10;
    --good: #6fd49b; --good-soft: #15301f; --bad: #ff8077; --bad-soft: #3a1a18;
    --t-key: #8fb4ff; --t-str: #8fd6a5; --t-num: #d1a6ff; --t-bool: #f2a66b; --t-null: #7f889a; --t-punc: #8b94a5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #161a21; --sunk: #12161c; --ink: #e4e8ef; --muted: #98a1b3; --faint: #5f6879; --line: #2a303b;
  --accent: #f2b24a; --accent-ink: #1d1405; --accent-soft: #3a2a10;
  --good: #6fd49b; --good-soft: #15301f; --bad: #ff8077; --bad-soft: #3a1a18;
  --t-key: #8fb4ff; --t-str: #8fd6a5; --t-num: #d1a6ff; --t-bool: #f2a66b; --t-null: #7f889a; --t-punc: #8b94a5;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; }
.app {
  max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  display: flex; flex-direction: column; gap: 14px;
}

/* Header */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--mono); font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
.brand h1 b { color: var(--accent); font-weight: 600; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
select, button, .filebtn {
  font: 500 13px/1 var(--ui); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; cursor: pointer;
}
select { padding-right: 6px; }
button:hover, .filebtn:hover, select:hover { border-color: var(--faint); }
button:focus-visible, select:focus-visible, .filebtn:focus-within, input[type="checkbox"]:focus-visible, textarea:focus-visible, summary:focus-visible, .tree .key:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.06); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
button.ghost:hover { color: var(--ink); border-color: var(--line); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); cursor: pointer; user-select: none; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.sep { width: 1px; height: 22px; background: var(--line); }
.filebtn { position: relative; display: inline-flex; align-items: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
kbd { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: var(--sunk); }

/* Panes */
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.pane {
  display: flex; flex-direction: column; min-width: 0;
  height: clamp(380px, calc(100vh - 190px), 900px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 7px 8px 7px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); min-height: 44px; box-sizing: border-box;
}
.pane-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.badge { font: 500 11px var(--ui); letter-spacing: 0; text-transform: none; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.pane-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

textarea {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; resize: none; border: 0; margin: 0;
  padding: 12px 14px; background: transparent; color: var(--ink);
  font: 13px/1.6 var(--mono); white-space: pre; overflow: auto; tab-size: 2;
}
textarea::placeholder { color: var(--faint); }
textarea:focus-visible { outline-offset: -2px; }
.pane.dragging { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.tabs button { border: 0; background: transparent; padding: 5px 12px; color: var(--muted); border-radius: 4px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

.view { flex: 1; min-height: 0; overflow: auto; }
pre.code { margin: 0; padding: 12px 14px 12px 0; font: 13px/1.6 var(--mono); color: var(--ink); counter-reset: ln; tab-size: 4; min-width: max-content; }
pre.code .ln { display: block; position: relative; padding-left: 4.2em; white-space: pre; }
pre.code .ln::before {
  counter-increment: ln; content: counter(ln);
  position: absolute; left: 0; width: 3.2em; text-align: right; color: var(--faint);
  font-variant-numeric: tabular-nums; user-select: none;
}
pre.code.wrap { min-width: 0; }
pre.code.wrap .ln { white-space: pre-wrap; word-break: break-all; }
pre.code.plain { padding-left: 14px; white-space: pre; }
.t-k { color: var(--t-key); }
.t-s { color: var(--t-str); }
.t-n { color: var(--t-num); }
.t-b { color: var(--t-bool); }
.t-z { color: var(--t-null); font-style: italic; }
.t-p { color: var(--t-punc); }

/* Tree */
.tree { padding: 10px 14px 16px; font: 13px/1.7 var(--mono); }
.tree details > .kids { padding-left: 18px; border-left: 1px dashed var(--line); margin-left: 5px; }
.tree summary { cursor: pointer; list-style: none; white-space: nowrap; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "▸"; display: inline-block; width: 14px; color: var(--faint); transition: transform 0.12s; }
.tree details[open] > summary::before { transform: rotate(90deg); }
.tree .leaf { padding-left: 14px; white-space: nowrap; }
.tree .key { color: var(--t-key); cursor: pointer; border-radius: 3px; }
.tree .key:hover { background: var(--accent-soft); }
.tree .idx { color: var(--faint); }
.tree .cnt { color: var(--faint); font-family: var(--ui); font-size: 12px; margin: 0 6px; }
.tree .sel > .key, .tree summary.sel .key { background: var(--accent-soft); }
.pathbar {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line); background: var(--sunk);
  font: 12px var(--mono); color: var(--muted); min-width: 0;
}
.pathbar code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--ink); }

/* Messages */
.empty, .errcard { margin: 18px 16px; max-width: 60ch; }
.empty { color: var(--muted); line-height: 1.6; }
.empty strong { color: var(--ink); font-weight: 600; }
.errcard { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.errcard h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--bad); letter-spacing: 0.02em; }
.errcard p { margin: 0; line-height: 1.5; }
.errcard pre { margin: 0; padding: 10px 12px; background: var(--surface); border-radius: 6px; font: 12.5px/1.55 var(--mono); overflow-x: auto; color: var(--ink); }
.errcard pre .caret { color: var(--bad); font-weight: 600; }
.errcard button { align-self: flex-start; }

/* Status */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); min-height: 26px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--good); background: var(--good-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.stats { font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.stats span b { color: var(--ink); font-weight: 500; }
.hint { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px);
  background: var(--ink); color: var(--bg); font-weight: 500; font-size: 13px; padding: 8px 14px; border-radius: 6px;
  opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .panes { grid-template-columns: minmax(0, 1fr); }
  .pane { height: 60vh; min-height: 320px; }
  .hint { display: none; }
  .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1><b>{</b>brace<b>}</b></h1>
      <p>Format, validate and explore JSON. Runs entirely in your browser.</p>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Formatting options">
      <label class="field" for="indent">Indent
        <select id="indent">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tabs</option>
        </select>
      </label>
      <label class="check" for="sort"><input type="checkbox" id="sort"> Sort keys</label>
      <span class="sep" aria-hidden="true"></span>
      <button class="primary" id="btn-format" type="button">Format</button>
      <button id="btn-minify" type="button">Minify</button>
    </div>
  </header>

  <main class="panes">
    <section class="pane" id="in-pane" aria-label="Input">
      <div class="pane-head">
        <div class="pane-title">Input <span class="badge" id="sample-badge" hidden>Example data</span></div>
        <div class="pane-actions">
          <label class="filebtn ghost" style="border-color:transparent;background:transparent;color:var(--muted)">Open file
            <input type="file" id="file" accept=".json,application/json,text/plain" aria-label="Open a JSON file">
          </label>
          <button class="ghost" id="btn-sample" type="button">Sample</button>
          <button class="ghost" id="btn-clear" type="button">Clear</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="JSON input"
        placeholder="Paste JSON here, or drop a .json file"></textarea>
    </section>

    <section class="pane" aria-label="Result">
      <div class="pane-head">
        <div class="tabs" role="tablist" aria-label="Result view">
          <button role="tab" id="tab-text" aria-selected="true" aria-controls="view-text" type="button">Text</button>
          <button role="tab" id="tab-tree" aria-selected="false" aria-controls="view-tree" type="button">Tree</button>
        </div>
        <div class="pane-actions">
          <span id="tree-actions" hidden>
            <button class="ghost" id="btn-expand" type="button">Expand all</button>
            <button class="ghost" id="btn-collapse" type="button">Collapse</button>
          </span>
          <button id="btn-copy" type="button">Copy</button>
        </div>
      </div>
      <div class="view" id="view-text" role="tabpanel" aria-labelledby="tab-text"><pre class="code" id="code"></pre></div>
      <div class="view" id="view-tree" role="tabpanel" aria-labelledby="tab-tree" hidden><div class="tree" id="tree"></div></div>
      <div class="pathbar" id="pathbar" hidden>
        <span>Path</span><code id="path">$</code>
        <button class="ghost" id="btn-path" type="button">Copy path</button>
      </div>
    </section>
  </main>

  <div class="status" aria-live="polite">
    <span class="chip" id="chip">Waiting for input</span>
    <span class="stats" id="stats"></span>
    <span class="hint"><kbd id="mod">Ctrl</kbd><kbd>Enter</kbd> format</span>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const input = $('#input'), code = $('#code'), tree = $('#tree');
  const chip = $('#chip'), stats = $('#stats'), toast = $('#toast');
  const indentSel = $('#indent'), sortBox = $('#sort');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  const SAMPLE = '{"order":{"id":"ORD-20419","placedAt":"2026-11-08T09:41:27Z","status":"shipped","customer":{"name":"Mara Lindqvist","email":"mara@example.com","loyaltyTier":"gold"},"items":[{"sku":"KB-7720","title":"Mechanical keyboard, 75% layout","qty":1,"unitPrice":129.0},{"sku":"CB-0031","title":"Braided USB-C cable, 2 m","qty":2,"unitPrice":14.5}],"shipping":{"carrier":"DHL","tracking":"JD014600006281990","address":{"line1":"Sveavägen 44","city":"Stockholm","postcode":"111 34","country":"SE"}},"totals":{"subtotal":158.0,"shipping":0,"tax":39.5,"currency":"EUR"},"giftWrap":false,"notes":null}}';

  let mode = 'format';      // 'format' | 'minify'
  let current = '';         // last good output text
  let lastError = null;     // {pos,line,col}
  let isSample = false;

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /* ---------- Error location: a strict JSON scanner that reports where and why ---------- */
  function locate(text) {
    let i = 0;
    const n = text.length;
    const fail = (msg, p = i) => { throw { pos: p, msg }; };
    const what = (c) => c === undefined ? 'the end of the input' : (c === '\n' ? 'a line break' : '"' + c + '"');
    const ws = () => { while (i < n && (text[i] === ' ' || text[i] === '\t' || text[i] === '\n' || text[i] === '\r')) i++; };
    const NUM = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;

    function value() {
      ws();
      const c = text[i];
      if (c === '{') return obj();
      if (c === '[') return arr();
      if (c === '"') return str();
      if (c === '-' || (c >= '0' && c <= '9')) return num();
      for (const w of ['true', 'false', 'null']) if (text.startsWith(w, i)) { i += w.length; return; }
      if (c === undefined) fail('The input ends where a value was expected.');
      if (c === "'") fail('Strings must use double quotes, not single quotes.');
      if (c === '/') fail('JSON does not allow comments.');
      if (/[A-Za-z_]/.test(c)) {
        const word = /[A-Za-z_]\w*/y; word.lastIndex = i;
        fail('Unexpected word "' + word.exec(text)[0] + '". Text values need double quotes; literals are true, false and null (lowercase).');
      }
      fail('Expected a value but found ' + what(c) + '.');
    }
    function obj() {
      i++; ws();
      if (text[i] === '}') { i++; return; }
      for (;;) {
        ws();
        if (text[i] !== '"') {
          if (text[i] === "'") fail('Keys must use double quotes, not single quotes.');
          if (text[i] === undefined) fail('The input ends inside an object. A closing } is missing.');
          fail('Expected a key in double quotes but found ' + what(text[i]) + '.');
        }
        str(); ws();
        if (text[i] !== ':') fail('Expected a colon after the key but found ' + what(text[i]) + '.');
        i++; value(); ws();
        if (text[i] === ',') {
          const comma = i; i++; ws();
          if (text[i] === '}') fail('Trailing comma: remove the comma before }.', comma);
          continue;
        }
        if (text[i] === '}') { i++; return; }
        if (text[i] === undefined) fail('The input ends inside an object. A closing } is missing.');
        if (text[i] === '"') fail('Missing comma between properties.');
        fail('Expected a comma or } after the value but found ' + what(text[i]) + '.');
      }
    }
    function arr() {
      i++; ws();
      if (text[i] === ']') { i++; return; }
      for (;;) {
        value(); ws();
        if (text[i] === ',') {
          const comma = i; i++; ws();
          if (text[i] === ']') fail('Trailing comma: remove the comma before ].', comma);
          continue;
        }
        if (text[i] === ']') { i++; return; }
        if (text[i] === undefined) fail('The input ends inside an array. A closing ] is missing.');
        fail('Expected a comma or ] after the item but found ' + what(text[i]) + '.');
      }
    }
    function str() {
      const start = i; i++;
      while (i < n) {
        const c = text[i];
        if (c === '"') { i++; return; }
        if (c === '\\') {
          const e = text[i + 1];
          if (e !== undefined && '"\\/bfnrt'.includes(e)) { i += 2; continue; }
          if (e === 'u' && /^[0-9a-fA-F]{4}$/.test(text.substr(i + 2, 4))) { i += 6; continue; }
          fail('Invalid escape sequence. Allowed: \\" \\\\ \\/ \\b \\f \\n \\r \\t \\uXXXX.');
        }
        if (c < ' ') fail(c === '\n' ? 'Line break inside a string. Use \\n instead, or close the quote.' : 'Control character inside a string.');
        i++;
      }
      fail('This string is never closed. A closing " is missing.', start);
    }
    function num() {
      NUM.lastIndex = i;
      const m = NUM.exec(text);
      if (!m) fail('Invalid number.');
      i += m[0].length;
      if (text[i] === '.' || /[0-9]/.test(text[i] || '')) fail('Invalid number. Leading zeros and trailing dots are not allowed.');
    }

    try {
      if (text.charCodeAt(0) === 0xfeff) i = 1;
      value(); ws();
      if (i < n) fail('Extra content after the JSON value: ' + what(text[i]) + '.');
      return null;
    } catch (e) {
      if (e && typeof e.pos === 'number') return e;
      throw e;
    }
  }

  function lineCol(text, pos) {
    let line = 1, lineStart = 0;
    for (let k = 0; k < pos && k < text.length; k++) if (text[k] === '\n') { line++; lineStart = k + 1; }
    return { line, col: pos - lineStart + 1, lineStart };
  }

  /* ---------- Rendering ---------- */
  const TOK = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false)\b|\b(null)\b|([{}[\],])/g;
  function hl(line) {
    let out = '', last = 0, m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(line))) {
      out += esc(line.slice(last, m.index));
      if (m[1] !== undefined) out += m[2] !== undefined
        ? '<span class="t-k">' + esc(m[1]) + '</span><span class="t-p">' + m[2] + '</span>'
        : '<span class="t-s">' + esc(m[1]) + '</span>';
      else if (m[3] !== undefined) out += '<span class="t-n">' + m[3] + '</span>';
      else if (m[4] !== undefined) out += '<span class="t-b">' + m[4] + '</span>';
      else if (m[5] !== undefined) out += '<span class="t-z">null</span>';
      else out += '<span class="t-p">' + m[6] + '</span>';
      last = TOK.lastIndex;
    }
    return out + esc(line.slice(last));
  }

  function renderCode(s, wrap) {
    code.className = 'code' + (wrap ? ' wrap' : '');
    if (s.length > 2000000) { code.classList.add('plain'); code.textContent = s; return; }
    code.innerHTML = s.split('\n').map((l) => '<span class="ln">' + (hl(l) || ' ') + '</span>').join('');
  }

  const IDENT = /^[A-Za-z_$][\w$]*$/;
  const childPath = (p, k, isArr) => isArr ? p + '[' + k + ']' : (IDENT.test(k) ? p + '.' + k : p + '[' + JSON.stringify(k) + ']');

  function leafHtml(v) {
    if (v === null) return '<span class="t-z">null</span>';
    if (typeof v === 'string') return '<span class="t-s">' + esc(JSON.stringify(v)) + '</span>';
    if (typeof v === 'number') return '<span class="t-n">' + v + '</span>';
    return '<span class="t-b">' + v + '</span>';
  }
  function keyHtml(k, isIdx) {
    if (k === undefined) return '<span class="key" tabindex="0">$</span> ';
    return isIdx
      ? '<span class="key idx" tabindex="0">' + k + '</span><span class="t-p">: </span>'
      : '<span class="key" tabindex="0">' + esc(JSON.stringify(k)) + '</span><span class="t-p">: </span>';
  }

  function makeNode(k, v, path, depth, isIdx) {
    if (v === null || typeof v !== 'object') {
      const row = document.createElement('div');
      row.className = 'leaf';
      row.dataset.path = path;
      row.innerHTML = keyHtml(k, isIdx) + leafHtml(v);
      return row;
    }
    const isArr = Array.isArray(v);
    const count = isArr ? v.length : Object.keys(v).length;
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.dataset.path = path;
    s.innerHTML = keyHtml(k, isIdx) + '<span class="t-p">' + (isArr ? '[' : '{') + '</span><span class="cnt">' +
      count + ' ' + (isArr ? (count === 1 ? 'item' : 'items') : (count === 1 ? 'key' : 'keys')) +
      '</span><span class="t-p">' + (isArr ? ']' : '}') + '</span>';
    d.append(s);
    d._v = v; d._path = path; d._depth = depth;
    d.addEventListener('toggle', () => { if (d.open) fill(d); });
    if (depth < 2 && count <= 200) { fill(d); d.open = true; }
    return d;
  }
  function fill(d) {
    if (d._filled) return;
    d._filled = true;
    const v = d._v, isArr = Array.isArray(v);
    const box = document.createElement('div');
    box.className = 'kids';
    const keys = isArr ? v.map((_, i) => i) : Object.keys(v);
    const frag = document.createDocumentFragment();
    for (const k of keys) frag.append(makeNode(k, v[k], childPath(d._path, k, isArr), d._depth + 1, isArr));
    box.append(frag);
    d.append(box);
  }
  function renderTree(data) {
    tree.textContent = '';
    tree.append(makeNode(undefined, data, '$', 0, false));
    $('#path').textContent = '$';
  }

  /* ---------- Main ---------- */
  function sortDeep(v) {
    if (Array.isArray(v)) return v.map(sortDeep);
    if (v && typeof v === 'object') {
      const o = {};
      for (const k of Object.keys(v).sort((a, b) => a.localeCompare(b))) o[k] = sortDeep(v[k]);
      return o;
    }
    return v;
  }
  function measure(v) {
    let count = 0, depth = 0;
    const stack = [[v, 1]];
    while (stack.length) {
      const [x, d] = stack.pop();
      count++;
      if (d > depth) depth = d;
      if (x && typeof x === 'object') for (const k in x) stack.push([x[k], d + 1]);
    }
    return { count, depth };
  }
  const bytes = (s) => { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length; } };
  const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';

  function indentValue() {
    const v = indentSel.value;
    return v === 'tab' ? '\t' : Number(v);
  }

  function setChip(kind, text) { chip.className = 'chip' + (kind ? ' ' + kind : ''); chip.textContent = text; }

  function showEmpty() {
    current = ''; lastError = null;
    code.className = 'code';
    $('#view-text').innerHTML = '<div class="empty"><strong>Nothing to format yet.</strong><br>Paste JSON into the input, drop a .json file on it, or press Sample to try an example order.</div>';
    tree.innerHTML = '<div class="empty">The tree appears once the input is valid JSON.</div>';
    setChip('', 'Waiting for input');
    stats.textContent = '';
  }

  function ensureCodeView() {
    const view = $('#view-text');
    if (!view.contains(code)) { view.textContent = ''; view.append(code); }
  }

  function showError(text, err) {
    current = '';
    const { line, col, lineStart } = lineCol(text, err.pos);
    lastError = { pos: err.pos, line };
    let lineEnd = text.indexOf('\n', lineStart);
    if (lineEnd === -1) lineEnd = text.length;
    let src = text.slice(lineStart, lineEnd).replace(/\t/g, ' ');
    let caretAt = col - 1;
    if (src.length > 90) {
      const from = Math.max(0, caretAt - 45);
      src = (from > 0 ? '…' : '') + src.slice(from, from + 90) + (from + 90 < src.length ? '…' : '');
      caretAt = caretAt - from + (from > 0 ? 1 : 0);
    }
    const view = $('#view-text');
    view.innerHTML =
      '<div class="errcard"><h2>Line ' + line + ', column ' + col + '</h2><p>' + esc(err.msg) + '</p>' +
      '<pre>' + esc(src) + '\n<span class="caret">' + ' '.repeat(Math.max(0, caretAt)) + '^</span></pre>' +
      '<button type="button" id="btn-goto">Show in input</button></div>';
    $('#btn-goto').addEventListener('click', gotoError);
    tree.innerHTML = '<div class="empty">Fix the error on line ' + line + ' to see the tree.</div>';
    setChip('bad', 'Invalid JSON');
    stats.innerHTML = '<span>Error at <b>line ' + line + ', col ' + col + '</b></span>';
  }

  function gotoError() {
    if (!lastError) return;
    input.focus();
    input.setSelectionRange(lastError.pos, Math.min(lastError.pos + 1, input.value.length));
    const lh = parseFloat(getComputedStyle(input).lineHeight) || 20;
    input.scrollTop = Math.max(0, (lastError.line - 4) * lh);
  }

  function run(newMode) {
    if (newMode) mode = newMode;
    const text = input.value.replace(/^﻿/, '');
    if (!text.trim()) { showEmpty(); return; }
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      const err = locate(text) || { pos: 0, msg: e.message };
      showError(text, err);
      return;
    }
    lastError = null;
    if (sortBox.checked) data = sortDeep(data);
    current = mode === 'minify' ? JSON.stringify(data) : JSON.stringify(data, null, indentValue());
    ensureCodeView();
    renderCode(current, mode === 'minify');
    renderTree(data);
    const m = measure(data);
    setChip('ok', mode === 'minify' ? 'Valid · minified' : 'Valid JSON');
    stats.innerHTML =
      '<span>Input <b>' + fmtBytes(bytes(text)) + '</b> → output <b>' + fmtBytes(bytes(current)) + '</b></span>' +
      '<span><b>' + m.count.toLocaleString() + '</b> values</span>' +
      '<span>Depth <b>' + m.depth + '</b></span>';
  }

  /* ---------- Clipboard + toast ---------- */
  let toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }
  function copyText(text, label, fallbackEl) {
    if (!text) { say('Nothing to copy yet'); return; }
    const selectFallback = () => {
      if (fallbackEl) {
        const r = document.createRange(); r.selectNodeContents(fallbackEl);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        say('Selected. Press ' + ($('#mod').textContent) + '+C to copy');
      } else say('Copy is blocked here. Select the text instead.');
    };
    try {
      navigator.clipboard.writeText(text).then(() => say(label), selectFallback);
    } catch (e) { selectFallback(); }
  }

  /* ---------- Wiring ---------- */
  let timer;
  input.addEventListener('input', () => {
    if (isSample) { isSample = false; $('#sample-badge').hidden = true; }
    clearTimeout(timer);
    timer = setTimeout(() => {
      run();
      if (input.value.length < 500000) store.set('brace:draft', input.value);
    }, 180);
  });

  $('#btn-format').addEventListener('click', () => run('format'));
  $('#btn-minify').addEventListener('click', () => run('minify'));
  indentSel.addEventListener('change', () => { store.set('brace:indent', indentSel.value); run('format'); });
  sortBox.addEventListener('change', () => { store.set('brace:sort', sortBox.checked ? '1' : ''); run(); });

  function loadSample() {
    input.value = SAMPLE;
    isSample = true;
    $('#sample-badge').hidden = false;
    run('format');
  }
  $('#btn-sample').addEventListener('click', loadSample);
  $('#btn-clear').addEventListener('click', () => {
    input.value = ''; isSample = false; $('#sample-badge').hidden = true;
    store.set('brace:draft', ''); run(); input.focus();
  });

  function readFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      input.value = String(r.result);
      isSample = false; $('#sample-badge').hidden = true;
      run('format');
      say('Opened ' + file.name);
    };
    r.onerror = () => say('Could not read ' + file.name);
    r.readAsText(file);
  }
  $('#file').addEventListener('change', (e) => { readFile(e.target.files[0]); e.target.value = ''; });

  const inPane = $('#in-pane');
  ['dragenter', 'dragover'].forEach((t) => inPane.addEventListener(t, (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); inPane.classList.add('dragging'); }
  }));
  ['dragleave', 'drop'].forEach((t) => inPane.addEventListener(t, () => inPane.classList.remove('dragging')));
  inPane.addEventListener('drop', (e) => {
    if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); readFile(e.dataTransfer.files[0]); }
  });

  $('#btn-copy').addEventListener('click', () => copyText(current, mode === 'minify' ? 'Copied minified JSON' : 'Copied formatted JSON', code));

  // Tabs
  function showTab(which) {
    const isTree = which === 'tree';
    $('#tab-text').setAttribute('aria-selected', String(!isTree));
    $('#tab-tree').setAttribute('aria-selected', String(isTree));
    $('#view-text').hidden = isTree;
    $('#view-tree').hidden = !isTree;
    $('#tree-actions').hidden = !isTree;
    $('#pathbar').hidden = !isTree;
    store.set('brace:tab', which);
  }
  $('#tab-text').addEventListener('click', () => showTab('text'));
  $('#tab-tree').addEventListener('click', () => showTab('tree'));

  $('#btn-expand').addEventListener('click', () => {
    let opened = 0, round;
    do {
      round = 0;
      tree.querySelectorAll('details:not([open])').forEach((d) => { if (opened < 5000) { fill(d); d.open = true; opened++; round++; } });
    } while (round && opened < 5000);
    if (opened >= 5000) say('Expanded the first 5,000 nodes');
  });
  $('#btn-collapse').addEventListener('click', () => {
    tree.querySelectorAll('details').forEach((d, i) => { d.open = i === 0; });
  });

  function pick(target) {
    const holder = target.closest('[data-path]');
    if (!holder) return;
    tree.querySelectorAll('.sel').forEach((n) => n.classList.remove('sel'));
    holder.classList.add('sel');
    $('#path').textContent = holder.dataset.path;
  }
  tree.addEventListener('click', (e) => {
    if (e.target.classList.contains('key')) { e.preventDefault(); pick(e.target); }
  });
  tree.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('key')) { e.preventDefault(); pick(e.target); }
  });
  $('#btn-path').addEventListener('click', () => copyText($('#path').textContent, 'Copied path', $('#path')));

  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  $('#mod').textContent = isMac ? '⌘' : 'Ctrl';
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(e.shiftKey ? 'minify' : 'format'); }
  });

  // Restore per-viewer preferences, then start with the draft or the sample
  const savedIndent = store.get('brace:indent');
  if (savedIndent && [...indentSel.options].some((o) => o.value === savedIndent)) indentSel.value = savedIndent;
  sortBox.checked = store.get('brace:sort') === '1';
  if (store.get('brace:tab') === 'tree') showTab('tree');
  const draft = store.get('brace:draft');
  if (draft && draft.trim()) { input.value = draft; run('format'); } else loadSample();
})();
</script>
</body>
</html>

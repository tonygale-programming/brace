<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Format, minify and validate JSON in your browser, with a tree view and exact error locations. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a85d00'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<title>Brace JSON Formatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1><b>{</b>brace<b>}</b></h1>
      <p>Format, validate and explore JSON. Runs entirely in your browser.</p>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Formatting options">
      <label class="field" for="indent">Indent
        <select id="indent">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tabs</option>
        </select>
      </label>
      <label class="check" for="sort"><input type="checkbox" id="sort"> Sort keys</label>
      <span class="sep" aria-hidden="true"></span>
      <button class="primary" id="btn-format" type="button">Format</button>
      <button id="btn-minify" type="button">Minify</button>
    </div>
  </header>

  <main class="panes">
    <section class="pane" id="in-pane" aria-label="Input">
      <div class="pane-head">
        <div class="pane-title">Input <span class="badge" id="sample-badge" hidden>Example data</span></div>
        <div class="pane-actions">
          <label class="filebtn ghost">Open file
            <input type="file" id="file" accept=".json,application/json,text/plain" aria-label="Open a JSON file">
          </label>
          <button class="ghost" id="btn-sample" type="button">Sample</button>
          <button class="ghost" id="btn-clear" type="button">Clear</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="JSON input"
        placeholder="Paste JSON here, or drop a .json file"></textarea>
    </section>

    <section class="pane" aria-label="Result">
      <div class="pane-head">
        <div class="tabs" role="tablist" aria-label="Result view">
          <button role="tab" id="tab-text" aria-selected="true" aria-controls="view-text" type="button">Text</button>
          <button role="tab" id="tab-tree" aria-selected="false" aria-controls="view-tree" type="button">Tree</button>
        </div>
        <div class="pane-actions">
          <span id="tree-actions" hidden>
            <button class="ghost" id="btn-expand" type="button">Expand all</button>
            <button class="ghost" id="btn-collapse" type="button">Collapse</button>
          </span>
          <button id="btn-copy" type="button">Copy</button>
        </div>
      </div>
      <div class="view" id="view-text" role="tabpanel" aria-labelledby="tab-text"><pre class="code" id="code"></pre></div>
      <div class="view" id="view-tree" role="tabpanel" aria-labelledby="tab-tree" hidden><div class="tree" id="tree"></div></div>
      <div class="pathbar" id="pathbar" hidden>
        <span>Path</span><code id="path">$</code>
        <button class="ghost" id="btn-path" type="button">Copy path</button>
      </div>
    </section>
  </main>

  <div class="status" aria-live="polite">
    <span class="chip" id="chip">Waiting for input</span>
    <span class="stats" id="stats"></span>
    <span class="hint"><kbd id="mod">Ctrl</kbd><kbd>Enter</kbd> format</span>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>

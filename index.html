<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security policy: the page may only load its own files, and it may not send data anywhere.
       connect-src 'none' blocks fetch, XHR, WebSocket and beacons, so pasted JSON cannot leave
       the browser. The sha256 values allow exactly the two inline scripts below;
       scripts/release.py recalculates them, so never edit those scripts without running it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-XsPPtFbMHos+zZnvwBNAhJjVg34+CpXzOVRAkwQtmBc=' 'sha256-4Zao1dZ1/C2dUFYIipR24dl7Owi/gSzMnbUi/7fTwQM='; style-src 'self'; font-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">

  <title>Brace JSON Formatter</title>
  <meta name="description" content="Format, validate and repair JSON in your browser. Private: nothing you paste is uploaded, and it works offline.">
  <link rel="canonical" href="https://tonygale-programming.github.io/brace/">

  <!-- Link previews in chats and social networks -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Brace JSON Formatter">
  <meta property="og:description" content="Format, validate and repair JSON. Private: nothing you paste leaves your browser.">
  <meta property="og:url" content="https://tonygale-programming.github.io/brace/">
  <meta property="og:image" content="https://tonygale-programming.github.io/brace/icons/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons and installing as an app -->
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">

  <script>
    // Apply a saved Light or Dark choice before the page draws, so it never flashes
    // the wrong colours. Uses the same storage key as js/theme.js.
    try {
      const savedTheme = localStorage.getItem('brace:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {
      // Storage is blocked: the page follows the system setting.
    }
  </script>

  <!-- Every own file carries ?v=<release>. Browsers cache files for 10 minutes, so a new
       release needs new URLs or visitors get the new page with old styles or scripts.
       Run scripts/release.py before pushing: see "Releasing" in the README. -->
  <link rel="stylesheet" href="styles.css?v=2026-11-09.4">
  <script type="importmap">
    {
      "imports": {
        "./js/json-engine.js": "./js/json-engine.js?v=2026-11-09.4",
        "./js/syntax-checker.js": "./js/syntax-checker.js?v=2026-11-09.4",
        "./js/result-panel.js": "./js/result-panel.js?v=2026-11-09.4",
        "./js/highlighter.js": "./js/highlighter.js?v=2026-11-09.4",
        "./js/tree-view.js": "./js/tree-view.js?v=2026-11-09.4",
        "./js/notifications.js": "./js/notifications.js?v=2026-11-09.4",
        "./js/storage.js": "./js/storage.js?v=2026-11-09.4",
        "./js/html.js": "./js/html.js?v=2026-11-09.4",
        "./js/theme.js": "./js/theme.js?v=2026-11-09.4",
        "./js/offline.js": "./js/offline.js?v=2026-11-09.4"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1><b>{</b>brace<b>}</b></h1>
        <p>
          Format, validate and repair JSON.
          <span class="privacy-note">Private: nothing you paste leaves this browser.</span>
          <a href="https://github.com/tonygale-programming/brace#privacy" target="_blank" rel="noopener">How?</a>
        </p>
      </div>

      <div class="toolbar" role="toolbar" aria-label="Formatting options">
        <label class="select-label" for="indent-select">
          Indent
          <span class="select-control">
            <select id="indent-select">
              <option value="2">2 spaces</option>
              <option value="4">4 spaces</option>
              <option value="tab">Tabs</option>
            </select>
          </span>
        </label>
        <label class="checkbox-label" for="sort-keys-checkbox">
          <input type="checkbox" id="sort-keys-checkbox">
          Sort keys
        </label>
        <span class="separator" aria-hidden="true"></span>
        <div class="button-group">
          <button type="button" class="primary" id="format-button">Format</button>
          <button type="button" id="minify-button">Minify</button>
        </div>
        <span class="separator" aria-hidden="true"></span>
        <div class="segmented-control" role="group" aria-label="Colour theme">
          <button type="button" data-theme-choice="auto" aria-pressed="true" title="Follow your system setting">Auto</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
    </header>

    <main class="panes">
      <section class="pane" id="input-pane" aria-label="Input">
        <div class="pane-header">
          <div class="pane-title">
            Input
            <span class="badge" id="sample-badge" hidden>Example data</span>
          </div>
          <div class="pane-actions">
            <label class="file-button ghost">
              Open file
              <input type="file" id="file-input" accept=".json,application/json,text/plain" aria-label="Open a JSON file">
            </label>
            <button type="button" class="ghost" id="sample-button">Sample</button>
            <button type="button" class="ghost" id="repair-button"
              title="Fix trailing commas, single quotes, comments, missing quotes and more">Repair</button>
            <button type="button" class="ghost" id="clear-button">Clear</button>
          </div>
        </div>
        <textarea id="json-input" spellcheck="false" autocomplete="off" autocapitalize="off"
          aria-label="JSON input" placeholder="Paste JSON here, or drop a .json file"></textarea>
      </section>

      <section class="pane" aria-label="Result">
        <div class="pane-header">
          <div class="segmented-control" role="tablist" aria-label="Result view">
            <button type="button" role="tab" id="text-tab" aria-selected="true" aria-controls="text-view">Text</button>
            <button type="button" role="tab" id="tree-tab" aria-selected="false" aria-controls="tree-view">Tree</button>
          </div>
          <div class="pane-actions">
            <span id="tree-actions" hidden>
              <button type="button" class="ghost" id="expand-button">Expand all</button>
              <button type="button" class="ghost" id="collapse-button">Collapse</button>
            </span>
            <button type="button" id="copy-button">Copy</button>
          </div>
        </div>

        <div class="result-view" id="text-view" role="tabpanel" aria-labelledby="text-tab">
          <pre class="code" id="formatted-code"></pre>
        </div>
        <div class="result-view" id="tree-view" role="tabpanel" aria-labelledby="tree-tab" hidden>
          <div class="tree" id="tree-root"></div>
        </div>

        <div class="path-bar" id="path-bar" hidden>
          <span>Path</span>
          <code id="selected-path">$</code>
          <button type="button" class="ghost" id="copy-path-button">Copy path</button>
        </div>
      </section>
    </main>

    <div class="status-bar" aria-live="polite">
      <span class="status-chip" id="status-chip">Waiting for input</span>
      <span class="stats" id="stats"></span>
      <span class="shortcut-hint"><kbd id="modifier-key">Ctrl</kbd><kbd>Enter</kbd> format</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- Libraries, served from this site and pinned with integrity hashes.
       lossless-json keeps numbers exact; jsonrepair powers the Repair button. -->
  <script src="vendor/lossless-json-4.3.3.js"
    integrity="sha384-WePis4DZsGmbLSh7jVUfBh/a94MXtwlbHPEXxp1bW6ta6shOIfrFw2vG2bTRVlGc"></script>
  <script src="vendor/jsonrepair-3.15.0.min.js"
    integrity="sha384-ctyn1nJHmrUzPGMF/9OFj4kWb28qMVVUo8mxOFFsucMChxe5/pHDOpj/EKKPzQOG"></script>

  <!-- App code. Modules run after the page and the libraries above have loaded. -->
  <script type="module" src="js/main.js?v=2026-11-09.4"></script>
</body>
</html>
